protocol_version: "2.2.0"
plan_id: "pcs-core-experiment-plan-v2.2"
title: "PCS-Core Experimental Validation Plan (Determinism, Fail-Closed Safety, Conformance, Reproducibility, and Optional External Cost Frame)"
language: "en"
created_utc: "2026-02-12T00:00:00Z"
audited_utc: "2026-02-12T00:00:00Z"
owner: "research-team"
status: "draft" # draft|frozen|completed

scientific_integrity:
  preregistration_required: true
  protocol_change_policy:
    threshold_changes_after_freeze: "forbidden"
    required_on_change:
      - "new_plan_id"
      - "new_frozen_timestamp"
      - "changelog_entry"
  mandatory_disclosures:
    - "all executed runs (including failures)"
    - "all protocol deviations"
    - "all exclusion decisions and reasons"
    - "negative or null results"
    - "known limitations and non-claims"
  claim_boundaries:
    - "This plan validates the verification layer (checker/receipts/proofs), not model semantic correctness."
    - "No claims about BRS/SRR runtime semantics are permitted (not implemented)."
    - "External cost/latency claims must be executed and reported under E6_OPTIONAL_COST as a separate frame."
    - "E6 outcomes are optional and non-gating for PCS-Core correctness/safety acceptance."

references:
  primary:
    - "Takahashi, K. (2026). Stop Recomputing for AI/LLMs: Proof-Carrying Skills for Compute-Saving Inference Reuse. Zenodo. https://doi.org/10.5281/zenodo.18490939"
  repository_docs:
    - "README.md"
    - "PoC/README.md"
    - "spec/rulebook.md"
    - "spec/schema-profile.md"
    - "spec/paper-conformance.md"

system_under_test:
  repo_root: "C:/Users/1991m/Proof-Carrying Skills (PCS-Core)"
  checker_entrypoint: "python reference-checker/verifier.py --bundle <bundle.json>"
  compatibility_entrypoint: "python compatibility-suite/run_vectors.py"
  vector_generation_entrypoint: "python test-vectors/generate_vectors.py"
  checker_version_expected: "pcs-core-min-verifier/0.5.0"
  implemented_modes:
    - "VTR bundle verification"
    - "VTR inline trace"
    - "VTR Merkle/event and blob-chunk inclusion proofs"
    - "GLUE composition verification (from_bundle + glue_receipt + to_bundle)"
    - "schema compatibility mode"
  reject_code_enum:
    - "PARSE_ERROR"
    - "SCHEMA_ERROR"
    - "VERSION_UNSUPPORTED"
    - "CONTRACT_INVALID"
    - "INVOCATION_MISMATCH"
    - "OUTPUT_MISMATCH"
    - "BASE64_INVALID"
    - "GAS_EXHAUSTED"
    - "TYPE_ERROR"
    - "BOUND_VIOLATION"
    - "PRECOND_FAIL"
    - "POSTCOND_FAIL"
    - "ASSERT_FAIL"
    - "PROOF_INVALID"
  deployment_profile:
    max_contract_bytes: 131072
    max_invocation_header_bytes: 16384
    max_receipt_bytes: 524288
    max_glue_receipt_bytes: 524288
    max_input_bytes: 262144
    max_output_bytes: 262144
    max_depth: 64
    max_ast_nodes: 2000
    max_value_bytes: 65536
    max_gas_predicate: 5000000
    max_predicates: 256
    max_inclusion_proofs: 2048
    max_proof_len: 256
    max_steps: 4096
    max_chunk_bytes: 262144
    max_proven_bytes: 8388608
    max_glue_mappings: 1024

scope:
  in_scope:
    - "Determinism and replay reproducibility of checker outputs"
    - "Fail-closed behavior on adversarial and malformed artifacts"
    - "Conformance of bundle/schema vectors"
    - "Boundary behavior near configured caps"
  out_of_scope:
    - "BRS runtime semantics"
    - "SRR runtime semantics"
    - "Claims about model quality/correctness"
  optional_scope:
    - "E6 separate external frame for end-to-end compute/cost/latency effects"

data_and_artifacts:
  vector_roots:
    - "test-vectors/accept"
    - "test-vectors/reject"
    - "test-vectors/schema/accept"
    - "test-vectors/schema/reject"
  expected_vector_count_after_generation: 40
  integrity_checks:
    - "expected.json exists for every vector"
    - "schema files parse as JSON"
    - "compatibility suite deterministic rerun equality"

objectives:
  primary:
    - "Show deterministic and reproducible checker outcomes for all official vectors."
    - "Show fail-closed safety: zero false accepts on reject vectors."
    - "Show conformance with implemented VTR/Blob/GLUE semantics under explicit bounds."
  secondary:
    - "Characterize runtime distribution of verification workload."
    - "Document boundary and limitation behavior transparently."
  optional_external:
    - "Estimate whether operational latency/cost improves under measured reuse in a disclosed workload."

metrics:
  deterministic_replay_match_rate:
    definition: "identical JSON output across repeated runs of same input"
    target: 1.0
  vector_pass_rate:
    definition: "passed_vectors / total_vectors"
    target: 1.0
  false_accept_rate_reject_suite:
    definition: "reject_vectors_accepted / total_reject_vectors"
    target: 0.0
  reject_code_match_rate:
    definition: "cases where actual rejection_code == expected rejection_code"
    target: 1.0
  verifier_runtime_ms:
    summary: ["mean", "median", "p95", "max"]
  verifier_cpu_time_ms:
    summary: ["mean", "median", "p95", "max"]
  optional_latency_improvement_ratio:
    definition: "1 - (pcs_total_latency / baseline_total_latency)"
  optional_cost_improvement_ratio:
    definition: "1 - (pcs_total_cost / baseline_total_cost)"

hypotheses:
  - id: "H1"
    statement: "All official vectors pass expected outcomes under compatibility suite."
    experiment: "E1_CONFORMANCE"
    success_condition: "vector_pass_rate == 1.0"
  - id: "H2"
    statement: "Checker outputs are deterministic under repeated replay."
    experiment: "E2_DETERMINISM"
    success_condition: "deterministic_replay_match_rate == 1.0"
  - id: "H3"
    statement: "Reject suite has zero false accepts."
    experiment: "E3_FAIL_CLOSED"
    success_condition: "false_accept_rate_reject_suite == 0.0"
  - id: "H4"
    statement: "Boundary vectors reject with expected bounded/fail-closed behavior."
    experiment: "E4_BOUNDARY"
    success_condition: "reject_code_match_rate == 1.0"
  - id: "H5"
    statement: "If E6 is executed in command mode with full disclosure, measured latency/cost may improve under reuse."
    experiment: "E6_OPTIONAL_COST"
    success_condition: "optional_frame_reports_claim_readiness_and_non-gating_label"

core_experiments:
  - id: "E0_PROTOCOL_FREEZE"
    goal: "Freeze protocol and environment fingerprint before result collection."
    steps:
      - "Record protocol SHA256"
      - "Record Python version and OS"
      - "Record checker_version from verifier output"
    outputs:
      - "PoC/runs/protocol_fingerprint.json"

  - id: "E1_CONFORMANCE"
    goal: "Validate expected decisions/reason-codes on all vectors."
    command: "python compatibility-suite/run_vectors.py"
    required_outputs:
      - "PoC/runs/e1_conformance.log"
      - "PoC/runs/e1_summary.json"
    pass_condition:
      vector_pass_rate: 1.0
      failed: 0

  - id: "E2_DETERMINISM"
    goal: "Stress repeatability on representative accept/reject cases."
    design:
      cases:
        - "test-vectors/accept/basic_echo/bundle.json"
        - "test-vectors/accept/vtr_merkle_blob/bundle.json"
        - "test-vectors/accept/glue_composition/bundle.json"
        - "test-vectors/reject/merkle_event_proof_invalid/bundle.json"
        - "test-vectors/reject/glue_mapping_mismatch/bundle.json"
      repeats_per_case: 1000
    required_outputs:
      - "PoC/runs/e2_replay_hashes.parquet"
      - "PoC/runs/e2_determinism_report.json"
    pass_condition:
      deterministic_replay_match_rate: 1.0

  - id: "E3_FAIL_CLOSED"
    goal: "Verify zero false accepts on entire reject suite."
    input_set: "test-vectors/reject/**/bundle.json"
    required_outputs:
      - "PoC/runs/e3_fail_closed.json"
      - "PoC/runs/e3_reject_reason_distribution.json"
    pass_condition:
      false_accept_rate_reject_suite: 0.0

  - id: "E4_BOUNDARY"
    goal: "Validate strict boundary behavior from curated edge vectors."
    required_cases:
      - "reject/proof_len_exceeded"
      - "reject/max_inclusion_proofs_exceeded"
      - "reject/max_proven_bytes_exceeded"
      - "reject/chunk_nonfinal_not_full"
      - "reject/mixed_trace_modes"
      - "reject/assertion_unproven_event"
      - "reject/glue_duplicate_to_path"
      - "reject/glue_bounds_exceed_profile"
      - "reject/glue_to_path_invalid"
    required_outputs:
      - "PoC/runs/e4_boundary_report.json"
    pass_condition:
      reject_code_match_rate: 1.0

  - id: "E5_SCHEMA_INTEROP"
    goal: "Validate schema-mode compatibility vectors."
    input_set: "test-vectors/schema/**/instance.json"
    required_outputs:
      - "PoC/runs/e5_schema_results.json"
    pass_condition:
      vector_pass_rate: 1.0

optional_external_experiments:
  - id: "E6_OPTIONAL_COST"
    frame: "separate_optional_non_gating"
    goal: "Estimate operational latency/cost effect of reuse with explicit external assumptions."
    enabled_by_default: false
    prerequisites:
      - "external wrapper with reproducible model runtime"
      - "auditable cost model (unit economics, registry overhead, certification overhead)"
      - "public disclosure of workload construction and command templates"
      - "all executed runs retained, including null/negative outcomes"
    implementation:
      runner: "python PoC/e6_optional_cost_runner.py --config PoC/e6_optional_cost_config.example.json --out-dir PoC/runs --tag e6_optional_cost"
      config_template: "PoC/e6_optional_cost_config.example.json"
      output_guide: "PoC/README.md"
    required_outputs:
      - "PoC/runs/e6_optional_cost_campaigns.csv"
      - "PoC/runs/e6_optional_cost_report.json"
      - "PoC/runs/e6_optional_cost_report.md"
      - "PoC/runs/e6_optional_cost_effective_config.json"
      - "PoC/runs/e6_optional_cost_command_log.jsonl"
      - "PoC/runs/e6_optional_cost_environment_fingerprint.json"
    analysis_requirements:
      - "report latency_improvement_ratio and cost_improvement_ratio"
      - "report 95% bootstrap CI"
      - "map cost terms to paper notation (Costrun, Costcheck, Costhash, Costregistry, Costcert/E[Nreuse])"
      - "separate simulated vs command-mode evidence"
      - "report claim-readiness criteria and whether all criteria are satisfied"
    non_gating: true
    design_controls:
      - "use auditable command templates with campaign/episode/seed placeholders"
      - "retain command execution log and environment fingerprint"
      - "randomize baseline vs verify episode order when feasible"
    claim_thresholds:
      min_claim_campaigns: 30
      min_claim_episodes: 100
    claim_readiness_criteria:
      - "mode is command"
      - "workload disclosure complete (workload_id, construction_doc, input_manifest_sha256, harness_version)"
      - "campaigns_completed >= min_claim_campaigns"
      - "episodes_per_campaign >= min_claim_episodes"
      - "95% CI lower bound > 0 for both latency and cost improvements"
    reporting_rule:
      - "Results must be labeled as optional and external to core verifier claims."
      - "Do not claim causal effect of PCS checker alone without controlled design."
      - "Do not present simulated scenarios as operational proof."

statistics_and_reporting:
  confidence_level: 0.95
  deterministic_metrics:
    method: "exact_match"
  binary_metrics:
    ci_method: "wilson"
  continuous_metrics:
    ci_method: "bootstrap_percentile"
    bootstrap_samples: 10000
  p_hacking_protections:
    - "No threshold edits after protocol freeze"
    - "No selective case exclusion without predeclared reason"
    - "Report all experiment outcomes, including non-significant ones"

execution_controls:
  deterministic_requirements:
    - "No network calls during verification"
    - "No unseeded randomness"
    - "Stable sorting in aggregations"
    - "Pinned runtime and dependency versions"
  environment_capture:
    required:
      - "os"
      - "python_version"
      - "cpu"
      - "memory"
      - "checker_version"
      - "schema_digests"
      - "vector_digest"

artifact_contract:
  root: "PoC/runs/"
  required_common:
    - "protocol_fingerprint.json"
    - "environment_fingerprint.json"
    - "command_log.txt"
  required_by_experiment:
    E1_CONFORMANCE:
      - "e1_conformance.log"
      - "e1_summary.json"
    E2_DETERMINISM:
      - "e2_replay_hashes.parquet"
      - "e2_determinism_report.json"
    E3_FAIL_CLOSED:
      - "e3_fail_closed.json"
      - "e3_reject_reason_distribution.json"
    E4_BOUNDARY:
      - "e4_boundary_report.json"
    E5_SCHEMA_INTEROP:
      - "e5_schema_results.json"
  required_by_optional_experiment:
    E6_OPTIONAL_COST:
      - "e6_optional_cost_campaigns.csv"
      - "e6_optional_cost_report.json"
      - "e6_optional_cost_report.md"
      - "e6_optional_cost_effective_config.json"
      - "e6_optional_cost_command_log.jsonl"
      - "e6_optional_cost_environment_fingerprint.json"

publication_requirements:
  mandatory_outputs:
    - "PoC/reports/final_report.json"
    - "PoC/reports/final_report.md"
    - "PoC/reports/claim_evidence_matrix.csv"
    - "PoC/reports/limitations.md"
    - "PoC/reports/repro_manifest.json"
  final_report_sections:
    - "Protocol and freeze metadata"
    - "Environment and reproducibility"
    - "Primary outcomes (H1-H4)"
    - "Optional outcomes (H5/E6)"
    - "Negative results and deviations"
    - "Limitations and non-claims"
    - "Raw artifact index"
  transparency_rules:
    - "Do not omit failed runs."
    - "Do not relabel optional results as core guarantees."
    - "Clearly separate measured facts from interpretation."

release_gates:
  hard_gates:
    - "E1_CONFORMANCE pass_condition satisfied"
    - "E2_DETERMINISM pass_condition satisfied"
    - "E3_FAIL_CLOSED pass_condition satisfied"
    - "E4_BOUNDARY pass_condition satisfied"
    - "E5_SCHEMA_INTEROP pass_condition satisfied"
  soft_gates:
    - "Runtime metrics reported with uncertainty"
  block_conditions:
    - "any false accept in reject suite"
    - "determinism mismatch"
    - "missing required artifact"
    - "undisclosed protocol deviation"

notes:
  - "Safety (false-accept prevention) is a hard gate."
  - "Limitation reporting is mandatory; low or zero gain results must be published as-is."
  - "E6_OPTIONAL_COST is a separate optional frame and does not change PCS-Core accept/reject guarantees."
  - "Use command-mode E6 with full workload disclosure before making operational cost/latency claims."
  - "Operational claim readiness requires disclosure + sample-size thresholds + positive CI lower bounds."