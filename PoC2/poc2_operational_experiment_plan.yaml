protocol_version: "2.3.0"
plan_id: "pcs-core-poc2-operational-load-v1"
title: "PCS-Core PoC2: Real-Operational Load Experiment Plan"
language: "en"
created_utc: "2026-02-13T00:00:00Z"
owner: "research-team"
status: "draft"  # draft|frozen|completed
staged_rollout_ref: "PoC2/poc2_production_rollout_plan.yaml"
stage_profiles_ref: "PoC2/poc2_stage_profiles.yaml"

purpose:
  primary:
    - "Measure operational latency/cost effects of PCS reuse under real inference workloads."
    - "Identify break-even region by reuse count (N_reuse) and checker cost ratio (c_check/c_run)."
  secondary:
    - "Validate fail-closed behavior and deterministic verification under operational stress."
    - "Quantify when PCS hurts performance (negative-gain region) and publish it."

scientific_integrity:
  preregistration_required: true
  freeze_before_runs: true
  no_threshold_edit_after_freeze: true
  full_disclosure_required:
    - "all runs including failures and negative outcomes"
    - "all protocol deviations"
    - "all exclusions with reasons"
  claim_boundaries:
    - "This plan evaluates operational economics/latency of PCS integration."
    - "This plan does not claim semantic correctness uplift of base models."
    - "Any gains are workload- and cost-model-dependent."
  non_claims:
    - "No universal positive gain claim across all workloads."
    - "No causal claim beyond controlled factors defined in this protocol."

system_under_test:
  repo_root: "Proof-Carrying Skills (PCS-Core)"
  checker_entrypoint: "python reference-checker/verifier.py --bundle <bundle.json>"
  compatibility_entrypoint: "python compatibility-suite/run_vectors.py"
  operational_runner_entrypoint: "python PoC2/poc2_operational_runner.py --config PoC2/poc2_operational_config.yaml --out-dir PoC2/runs --tag poc2"
  required_modes:
    - "command_mode"      # real command/API/local runtime measurement
    - "sim_mode_optional" # optional calibration only, non-gating
  deployment_profile_ref: "spec/schema-profile.md"

workload_matrix:
  workload_families:
    - id: "W1_chat_llm_api"
      description: "External LLM API inference workload"
    - id: "W2_local_vllm_or_equivalent"
      description: "Local inference server workload"
    - id: "W3_rag_pipeline"
      description: "RAG-style multi-step pipeline workload"
  complexity_tiers:
    - "light"
    - "medium"
    - "heavy"
  concurrency_levels: [1, 4, 8, 16]
  reuse_counts_N: [1, 3, 5, 10, 30, 100, 300]
  episode_count_per_campaign: 120
  campaign_repetitions_per_cell: 10
  random_seeds: [101, 202, 303, 404, 505]
  ordering:
    design: "randomized_crossover_abba"
    unit: "campaign"
    note: "Randomize baseline/pcs order to reduce time-drift bias."
  warmup:
    enabled: true
    warmup_episodes: 20
    excluded_from_analysis: true

cost_model:
  notation:
    c_run_per_ms: "baseline runtime unit cost"
    c_check_per_ms: "checker runtime unit cost"
    c_hash_per_op: "hash/receipt operation cost"
    c_registry_fixed: "registry fixed overhead per campaign"
    c_cert_fixed: "certification fixed overhead per campaign"
  scenarios:
    - id: "C1_equal_cost"
      c_check_to_c_run_ratio: 1.0
    - id: "C2_moderate_advantage"
      c_check_to_c_run_ratio: 0.75
    - id: "C3_strong_advantage"
      c_check_to_c_run_ratio: 0.50
    - id: "C4_adverse_checker"
      c_check_to_c_run_ratio: 1.25
  fixed_overhead_sweep:
    c_registry_fixed: [0.0, 0.001, 0.003, 0.006, 0.010]
    c_cert_fixed: [0.0, 0.0005, 0.001, 0.003]
  sensitivity_required: true

hypotheses:
  - id: "H1_latency_region"
    statement: "There exists a region (workload, N_reuse) where latency_improvement_ratio > 0 with CI lower bound > 0."
    success_condition: "for at least one workload family and one complexity tier, 95% CI lower > 0"
  - id: "H2_cost_region"
    statement: "There exists a region (N_reuse, c_check/c_run, fixed overhead) where cost_improvement_ratio > 0 with CI lower bound > 0."
    success_condition: "for at least one cost scenario and one fixed-overhead setting, 95% CI lower > 0"
  - id: "H3_fail_closed"
    statement: "Fail-closed behavior holds under operational stress (no false accepts in reject injections)."
    success_condition: "false_accept_rate_reject_injection == 0.0"
  - id: "H4_determinism"
    statement: "Deterministic replay remains exact for sampled operational receipts."
    success_condition: "deterministic_replay_match_rate == 1.0"

metrics:
  primary:
    latency_improvement_ratio:
      formula: "1 - (pcs_total_latency_ms / baseline_total_latency_ms)"
      summaries: ["mean", "median", "p95", "p99"]
    cost_improvement_ratio:
      formula: "1 - (pcs_total_cost / baseline_total_cost)"
      summaries: ["mean", "median", "p95", "p99"]
  secondary:
    throughput_qps:
      summaries: ["mean", "p50", "p95"]
    verifier_overhead_ms:
      summaries: ["mean", "p50", "p95", "p99"]
    cache_hit_rate:
      formula: "reused_invocations / total_invocations"
    acceptance_rate:
      formula: "accepted_receipts / total_receipts"
    reject_reason_distribution: {}
    deterministic_replay_match_rate: {}
    false_accept_rate_reject_injection: {}
  safety_gates:
    - "false_accept_rate_reject_injection == 0.0"
    - "deterministic_replay_match_rate == 1.0"

experiments:
  - id: "P0_PROTOCOL_FREEZE"
    goal: "Freeze plan, environment fingerprint, and workload manifest."
    outputs:
      - "PoC2/runs/poc2_protocol_fingerprint.json"
      - "PoC2/runs/poc2_environment_fingerprint.json"
      - "PoC2/runs/poc2_workload_manifest_sha256.json"

  - id: "P1_CONFORMANCE_SMOKE"
    goal: "Re-run compatibility suite as guardrail before operational campaigns."
    command: "python compatibility-suite/run_vectors.py"
    pass_condition:
      vector_pass_rate: 1.0
      failed: 0
    outputs:
      - "PoC2/runs/poc2_p1_conformance.log"
      - "PoC2/runs/poc2_p1_summary.json"

  - id: "P2_OPERATIONAL_ABBA"
    goal: "Measure baseline vs PCS under real workloads with randomized ABBA crossover."
    factors:
      - "workload_family"
      - "complexity_tier"
      - "concurrency"
      - "N_reuse"
      - "cost_scenario"
      - "fixed_overhead"
    controls:
      - "same prompt/input manifest per paired baseline/pcs campaign"
      - "same seed and environment for pair"
      - "warmup exclusion"
    outputs:
      - "PoC2/runs/poc2_campaigns.csv"
      - "PoC2/runs/poc2_command_log.jsonl"
      - "PoC2/runs/poc2_effective_config.json"
      - "PoC2/runs/poc2_latency_cost_raw.parquet"
      - "PoC2/runs/poc2_gemini_requests.jsonl"
      - "PoC2/runs/poc2_gemini_responses.jsonl"
      - "PoC2/runs/poc2_gemini_errors.jsonl"

  - id: "P3_STRESS_FAIL_CLOSED"
    goal: "Inject malformed/adversarial receipts during operational run and verify strict reject."
    injections:
      - "signature_corrupt"
      - "invocation_mismatch"
      - "proof_invalid"
      - "schema_error"
      - "gas_exhausted"
    pass_condition:
      false_accept_rate_reject_injection: 0.0
    outputs:
      - "PoC2/runs/poc2_fail_closed_report.json"
      - "PoC2/runs/poc2_reject_reason_distribution.json"

  - id: "P4_DETERMINISM_SAMPLE"
    goal: "Sample operational receipts and run replay determinism checks."
    design:
      sampled_receipts_per_cell: 30
      repeats_per_receipt: 100
    pass_condition:
      deterministic_replay_match_rate: 1.0
    outputs:
      - "PoC2/runs/poc2_replay_hashes.parquet"
      - "PoC2/runs/poc2_determinism_report.json"

analysis_plan:
  confidence_level: 0.95
  ci_method_continuous: "bootstrap_percentile"
  bootstrap_samples: 10000
  binary_ci_method: "wilson"
  modeling:
    mixed_effects:
      enabled: true
      response_variables:
        - "latency_improvement_ratio"
        - "cost_improvement_ratio"
      fixed_effects:
        - "workload_family"
        - "complexity_tier"
        - "concurrency"
        - "N_reuse"
        - "cost_scenario"
        - "fixed_overhead"
      random_effects:
        - "campaign_id"
        - "day_bucket"
  break_even_reporting:
    required: true
    outputs:
      - "N_break_even_by_workload.csv"
      - "checker_cost_ratio_break_even.csv"
      - "gain_region_heatmap_data.csv"

claim_readiness:
  minimum_requirements:
    - "mode == command_mode for reported operational claims"
    - "all workload manifests disclosed and hashed"
    - "campaigns_completed_per_cell >= 10"
    - "episodes_per_campaign >= 120"
    - "95% CI lower bound > 0 for claimed metric and target cell"
    - "all safety_gates passed"
  forbidden_claims:
    - "global/universal gain claim"
    - "model quality improvement claim without separate quality protocol"
  labeling_rules:
    - "Report positive and negative regions together."
    - "Clearly distinguish measured facts from interpretation."

execution_controls:
  deterministic_requirements:
    - "pinned python and dependency versions"
    - "no hidden randomness (seed everything)"
    - "stable aggregation order"
  environment_capture:
    required_fields:
      - "os"
      - "kernel"
      - "python_version"
      - "cpu_model"
      - "memory_gb"
      - "gpu_model"
      - "driver_version"
      - "checker_version"
      - "repo_commit_hash"
  retry_policy:
    max_retries_per_episode: 1
    record_all_retries: true
  timeout_policy:
    per_episode_timeout_sec: 120
    mark_timeout_as_failure: true

artifact_contract:
  root: "PoC2/runs/"
  required_common:
    - "poc2_protocol_fingerprint.json"
    - "poc2_environment_fingerprint.json"
    - "poc2_workload_manifest_sha256.json"
    - "poc2_command_log.jsonl"
    - "poc2_gemini_requests.jsonl"
    - "poc2_gemini_responses.jsonl"
    - "poc2_effective_config.json"
  required_by_experiment:
    P1_CONFORMANCE_SMOKE:
      - "poc2_p1_conformance.log"
      - "poc2_p1_summary.json"
    P2_OPERATIONAL_ABBA:
      - "poc2_campaigns.csv"
      - "poc2_latency_cost_raw.parquet"
    P3_STRESS_FAIL_CLOSED:
      - "poc2_fail_closed_report.json"
      - "poc2_reject_reason_distribution.json"
    P4_DETERMINISM_SAMPLE:
      - "poc2_replay_hashes.parquet"
      - "poc2_determinism_report.json"
  final_reports:
    - "PoC2/runs/poc2_final_report.json"
    - "PoC2/runs/poc2_final_report.md"

release_gates:
  hard_gates:
    - "P1_CONFORMANCE_SMOKE pass"
    - "P3_STRESS_FAIL_CLOSED pass"
    - "P4_DETERMINISM_SAMPLE pass"
    - "no missing artifacts from artifact_contract"
  soft_gates:
    - "break-even maps generated"
    - "negative region explicitly reported"
  block_conditions:
    - "any false accept in injected rejects"
    - "determinism mismatch"
    - "undisclosed protocol deviation"
    - "missing required artifact"

timeline:
  week_1:
    - "Freeze protocol and workload manifests"
    - "Implement poc2 runner and ABBA scheduler"
  week_2:
    - "Execute P1 + pilot P2 on one workload family"
    - "Tune observability/logging only (no threshold changes)"
  week_3_to_4:
    - "Run full matrix P2 + P3 + P4"
    - "Generate CI and break-even maps"
  week_5:
    - "Publish final report with full artifact index"

notes:
  - "PoC2 is operational-economics validation, not semantic model-evaluation."
  - "Publish negative/zero-gain regions to prevent survivorship bias."
  - "Use this plan as frozen prereg once approved."
  - "For production-load escalation and promotion gates, follow PoC2/poc2_production_rollout_plan.yaml."
